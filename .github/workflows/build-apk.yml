name: Build Storage Launcher Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Verify and package web assets
        run: |
          test -f dist/index.html
          rm -rf android/app/src/main/assets/public
          mkdir -p android/app/src/main/assets/public
          cp -R dist/. android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept all Android SDK license agreements
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "2433370746b414991fe6970163567b3668264d4e\n84831b9409646a918e30573bab4c9c91346d8abd\nd97537e51574a171e54a9d94943f5509746e01a1\ne9675446e0c0654121377233effa8738e108c3be\n89330d322230438e1ec07507322a3d659e98b1a9\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a\n60100719fe8698110996e03b9d6e4f5377797cd0" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > $ANDROID_HOME/licenses/android-googletv-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo -e "d97537e51574a171e54a9d94943f5509746e01a1" > $ANDROID_HOME/licenses/intel-android-sysimage-license
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Build Android debug APK
        run: gradle --no-daemon -p android clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Launcher-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Launcher-Web-Build
          path: dist/
          if-no-files-found: error
          retention-days: 14
