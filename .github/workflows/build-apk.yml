name: Build Storage Launcher Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript validation
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Verify web build
        run: |
          test -f dist/index.html
          echo "Vite production build verified."

      - name: Package web application into Android assets
        run: |
          mkdir -p android/app/src/main/assets/public
          rm -rf android/app/src/main/assets/public/*
          cp -R dist/. android/app/src/main/assets/public/
          test -f android/app/src/main/assets/public/index.html
          echo "Android web assets packaged successfully."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Android debug APK
        run: |
          cd android
          gradle --no-daemon clean assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Launcher-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Launcher-Web-Build
          path: dist/
          if-no-files-found: error
          retention-days: 14
