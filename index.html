<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <base href="./" />
    <title>Oni's Storage Launcher</title>
    <meta name="description" content="Oni's Storage Launcher by Oni Song — Minimalist phone-optimized PC desktop, storage manager, VRM 3D avatar studio, and customizable node window system." />
    <meta property="og:title" content="Oni's Storage Launcher" />
    <meta property="og:description" content="Oni's Storage Launcher by Oni Song — Minimalist phone-optimized PC desktop, storage manager, VRM 3D avatar studio, and customizable node window system." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#080c14" />
    <style>html,body{background:#03060c;margin:0;padding:0}</style>
    <script>
      // Boot watchdog: if the app bundle fails to load (e.g. a module script
      // is blocked), React never mounts and the page would otherwise sit
      // blank. Show a visible error with a reload button instead.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.childElementCount === 0) {
            document.body.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#03060c;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:24px;box-sizing:border-box"><div><h2>Oni's Storage Launcher failed to start</h2><p style="color:#94a3b8">The app code did not load. Check your connection, then tap Reload.</p><button style="background:#0891b2;color:#fff;border:0;border-radius:8px;padding:12px 24px;font-size:16px" onclick="location.reload()">Reload</button></div></div>';
          }
        }, 5000);
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <noscript><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#03060c;color:#e2e8f0;font-family:sans-serif;text-align:center;padding:24px">Oni's Storage Launcher needs JavaScript enabled to run.</div></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
